services:
  arrivo:
    build: .
    container_name: arrivo-in-italia
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ./data:/data
